<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Duel — Игра в слова на двоих Online</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & React DOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- PeerJS for free & instant P2P WebRTC connection without backend -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const KEYBOARD_ROWS = [
      ['Й', 'Ц', 'У', 'К', 'Е', 'Н', 'Г', 'Ш', 'Щ', 'З', 'Х', 'Ъ'],
      ['Ф', 'Ы', 'В', 'А', 'П', 'Р', 'О', 'Л', 'Д', 'Ж', 'Э'],
      ['Я', 'Ч', 'С', 'М', 'И', 'Т', 'Ь', 'Б', 'Ю']
    ];

    function App() {
      const [roomId, setRoomId] = useState('');
      const [role, setRole] = useState(null); // 'host' | 'guest' | 'local'
      const [peerConnected, setPeerConnected] = useState(false);
      const [hostReady, setHostReady] = useState(false);
      const [guestReady, setGuestReady] = useState(false);
      
      const [roomData, setRoomData] = useState({
        secretWord: '',
        currentInput: '',
        checkedStates: [],
        attempts: 0,
        maxAttempts: 6,
        status: 'lobby', // Изменено: Начинаем сразу с 'lobby' вместо 'setup'
        wordLength: 5
      });

      const [inputLetters, setInputLetters] = useState([]);
      const [letterStatuses, setLetterStatuses] = useState([]);
      const [activeCellIndex, setActiveCellIndex] = useState(0);
      const [secretInput, setSecretInput] = useState('');
      const [copied, setCopied] = useState(false);
      const [errorMessage, setErrorMessage] = useState('');

      const peerRef = useRef(null);
      const connRef = useRef(null);

      // Инициализация WebRTC P2P соединения
      useEffect(() => {
        const hash = window.location.hash.replace('#', '').trim().toUpperCase();
        
        if (hash && hash.startsWith('GUEST-')) {
          const hostPeerId = hash.replace('GUEST-', '');
          setRole('guest');
          setRoomId(hostPeerId);

          try {
            const peer = new Peer();
            peerRef.current = peer;

            peer.on('open', () => {
              const conn = peer.connect(hostPeerId);
              connRef.current = conn;

              conn.on('open', () => {
                setPeerConnected(true);
                // Отправляем сигнал хосту, что гость зашел в комнату
                conn.send({ type: 'GUEST_JOINED' });
              });

              conn.on('data', (data) => {
                if (data.type === 'SYNC_STATE') {
                  setRoomData(data.state);
                  setHostReady(data.hostReady || false);
                  setGuestReady(data.guestReady || false);
                  if (data.state.checkedStates && data.state.checkedStates.length > 0) {
                    setLetterStatuses(data.state.checkedStates);
                  }
                } else if (data.type === 'RESET') {
                  handleResetLocalState();
                }
              });
            });

            peer.on('error', () => {
              setRole('local');
            });
          } catch(e) {
            setRole('local');
          }

        } else {
          setRole('host');
          const randomId = 'WD-' + Math.random().toString(36).substring(2, 7).toUpperCase();
          setRoomId(randomId);

          try {
            const peer = new Peer(randomId);
            peerRef.current = peer;

            peer.on('open', (id) => {
              window.location.hash = 'GUEST-' + id;
            });

            peer.on('connection', (conn) => {
              connRef.current = conn;
              setPeerConnected(true);

              conn.on('data', (data) => {
                if (data.type === 'GUEST_JOINED') {
                  // При подключении гостя высылаем ему текущее состояние комнаты
                  sendStateToGuest(roomData, hostReady, guestReady);
                } else if (data.type === 'GUEST_TOGGLE_READY') {
                  setGuestReady(prev => {
                    const next = !prev;
                    sendStateToGuest(roomData, hostReady, next);
                    return next;
                  });
                } else if (data.type === 'GUEST_INPUT') {
                  setRoomData(prev => ({
                    ...prev,
                    currentInput: data.input
                  }));
                } else if (data.type === 'GUEST_CHECK') {
                  handleCheckGuestWord(data.guess, conn);
                }
              });
            });

            peer.on('error', () => {
              setRole('local');
            });
          } catch(e) {
            setRole('local');
          }
        }

        return () => {
          if (peerRef.current) peerRef.current.destroy();
        };
      }, []);

      const sendStateToGuest = (stateObj, hReady = hostReady, gReady = guestReady) => {
        if (connRef.current && connRef.current.open) {
          connRef.current.send({
            type: 'SYNC_STATE',
            state: stateObj,
            hostReady: hReady,
            guestReady: gReady
          });
        }
      };

      // Проверка на запуск этапа загадывания (Оба игрока подключены и готовы)
      useEffect(() => {
        if (role === 'host' && hostReady && (guestReady || role === 'local') && roomData.status === 'lobby') {
          const setupState = {
            ...roomData,
            status: 'setup' // Оба готовы -> Переходим к загадыванию слова!
          };
          setRoomData(setupState);
          sendStateToGuest(setupState, true, true);
        }
      }, [hostReady, guestReady, role, roomData.status]);

      // Загадывание слова Ведущим (После того как оба готовы)
      const handleSetSecretWord = (e) => {
        e.preventDefault();
        const cleanWord = secretInput.trim().toUpperCase();
        
        if (cleanWord.length < 3 || cleanWord.length > 10) {
          setErrorMessage('Слово должно быть от 3 до 10 букв!');
          return;
        }
        if (!/^[А-ЯЁ]+$/i.test(cleanWord)) {
          setErrorMessage('Используйте только русские буквы!');
          return;
        }

        setErrorMessage('');
        const initialStatuses = Array(cleanWord.length).fill('none');

        const newState = {
          secretWord: cleanWord,
          currentInput: '',
          checkedStates: initialStatuses,
          attempts: 0,
          maxAttempts: 6,
          status: 'playing', // Переходим сразу в саму игру!
          wordLength: cleanWord.length
        };

        setRoomData(newState);
        sendStateToGuest(newState, true, true);
      };

      // Гость/Хост нажимает "Готов" в Лобби
      const handleToggleHostReady = () => {
        if (role === 'host') {
          setHostReady(prev => {
            const next = !prev;
            sendStateToGuest(roomData, next, guestReady);
            return next;
          });
        }
      };

      const handleToggleGuestReady = () => {
        if (role === 'guest') {
          if (connRef.current && connRef.current.open) {
            connRef.current.send({ type: 'GUEST_TOGGLE_READY' });
          }
        } else if (role === 'local') {
          setHostReady(true);
          setGuestReady(true);
        }
      };

      // Проверка слова Гостя
      const handleCheckGuestWord = (guess, conn) => {
        setRoomData((prev) => {
          const target = prev.secretWord.split('');
          const guessArr = guess.split('');
          const results = Array(prev.wordLength).fill('absent');
          const targetTaken = Array(prev.wordLength).fill(false);

          guessArr.forEach((char, index) => {
            if (char === target[index]) {
              results[index] = 'correct';
              targetTaken[index] = true;
            }
          });

          guessArr.forEach((char, index) => {
            if (results[index] !== 'correct') {
              const foundIdx = target.findIndex((tChar, tIdx) => tChar === char && !targetTaken[tIdx]);
              if (foundIdx !== -1) {
                results[index] = 'present';
                targetTaken[foundIdx] = true;
              }
            }
          });

          const isWon = results.every(r => r === 'correct');
          const newAttempts = prev.attempts + 1;
          const isLost = !isWon && newAttempts >= prev.maxAttempts;
          const newStatus = isWon ? 'won' : (isLost ? 'lost' : 'playing');

          const updatedState = {
            ...prev,
            currentInput: guess,
            checkedStates: results,
            attempts: newAttempts,
            status: newStatus
          };

          if (conn && conn.open) {
            conn.send({
              type: 'SYNC_STATE',
              state: updatedState,
              hostReady: true,
              guestReady: true
            });
          }

          return updatedState;
        });
      };

      useEffect(() => {
        if (roomData.wordLength) {
          setInputLetters(Array(roomData.wordLength).fill(''));
          setLetterStatuses(Array(roomData.wordLength).fill('none'));
        }
      }, [roomData.wordLength]);

      const handleKeyPress = (letter) => {
        if (roomData.status !== 'playing') return;

        const newLetters = [...inputLetters];
        let targetIndex = activeCellIndex >= roomData.wordLength ? roomData.wordLength - 1 : activeCellIndex;

        newLetters[targetIndex] = letter.toUpperCase();
        
        const newStatuses = [...letterStatuses];
        newStatuses[targetIndex] = 'none';

        setInputLetters(newLetters);
        setLetterStatuses(newStatuses);

        if (targetIndex < roomData.wordLength - 1) {
          setActiveCellIndex(targetIndex + 1);
        }

        if (role === 'guest' && connRef.current && connRef.current.open) {
          connRef.current.send({
            type: 'GUEST_INPUT',
            input: newLetters.join('')
          });
        }
      };

      const handleDelete = () => {
        if (roomData.status !== 'playing') return;

        const newLetters = [...inputLetters];
        let targetIndex = activeCellIndex;

        if ((!newLetters[targetIndex] || newLetters[targetIndex] === '') && targetIndex > 0) {
          targetIndex = targetIndex - 1;
        }

        newLetters[targetIndex] = '';
        const newStatuses = [...letterStatuses];
        newStatuses[targetIndex] = 'none';

        setInputLetters(newLetters);
        setLetterStatuses(newStatuses);
        setActiveCellIndex(targetIndex);

        if (role === 'guest' && connRef.current && connRef.current.open) {
          connRef.current.send({
            type: 'GUEST_INPUT',
            input: newLetters.join('')
          });
        }
      };

      const handleCellClick = (index) => {
        if (roomData.status === 'playing') {
          setActiveCellIndex(index);
        }
      };

      const handleCheckWord = () => {
        if (roomData.status !== 'playing') return;

        const guess = inputLetters.join('');
        if (guess.length < roomData.wordLength || inputLetters.some(l => !l || l === '')) {
          setErrorMessage(`Заполните все ${roomData.wordLength} букв!`);
          return;
        }
        setErrorMessage('');

        if (role === 'guest' && connRef.current && connRef.current.open) {
          connRef.current.send({
            type: 'GUEST_CHECK',
            guess: guess
          });
        } else if (role === 'local' || role === 'host') {
          handleCheckGuestWord(guess, connRef.current);
        }
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (roomData.status !== 'playing') return;

          if (e.key === 'Enter') {
            handleCheckWord();
          } else if (e.key === 'Backspace') {
            handleDelete();
          } else if (e.key === 'ArrowLeft') {
            setActiveCellIndex(prev => Math.max(0, prev - 1));
          } else if (e.key === 'ArrowRight') {
            setActiveCellIndex(prev => Math.min(roomData.wordLength - 1, prev + 1));
          } else if (/^[а-яёА-ЯЁ]$/i.test(e.key)) {
            handleKeyPress(e.key.toUpperCase());
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [roomData.status, inputLetters, activeCellIndex, letterStatuses]);

      const handleResetLocalState = () => {
        setRoomData({
          secretWord: '',
          currentInput: '',
          checkedStates: [],
          attempts: 0,
          maxAttempts: 6,
          status: 'lobby', // Возврат в Лобби при новой игре
          wordLength: 5
        });
        setSecretInput('');
        setHostReady(false);
        setGuestReady(false);
        setLetterStatuses([]);
        setInputLetters([]);
      };

      const handleFullRestart = () => {
        handleResetLocalState();
        if (role === 'host' && connRef.current && connRef.current.open) {
          connRef.current.send({ type: 'RESET' });
        }
      };

      const startLocalDemo = () => {
        setRole('local');
        handleResetLocalState();
      };

      const copyRoomLink = () => {
        const url = window.location.href;
        navigator.clipboard.writeText(url);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const getCellColorClass = (status, isActive) => {
        let base = "transition-all duration-300 font-bold flex items-center justify-center rounded-xl border-2 text-2xl sm:text-3xl uppercase select-none shadow-md ";
        
        if (isActive) {
          base += "border-cyan-400 ring-4 ring-cyan-500/30 scale-105 ";
        } else {
          base += "border-slate-700 ";
        }

        switch (status) {
          case 'correct':
            return base + "bg-emerald-600 text-white border-emerald-500 shadow-emerald-900/40";
          case 'present':
            return base + "bg-amber-500 text-white border-amber-400 shadow-amber-900/40";
          case 'absent':
            return base + "bg-slate-800 text-slate-400 border-slate-700";
          default:
            return base + "bg-slate-900/80 text-white border-slate-700";
        }
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center justify-between p-3 sm:p-6">
          {/* Header */}
          <header className="w-full max-w-2xl flex flex-col sm:flex-row items-center justify-between gap-3 pb-4 border-b border-slate-800">
            <div className="flex items-center gap-3">
              <div className="p-2.5 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-2xl shadow-lg shadow-cyan-500/20">
                <i data-lucide="sparkles" class="w-6 h-6 text-white"></i>
              </div>
              <div>
                <h1 className="text-xl sm:text-2xl font-black tracking-wider bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                  WORD DUEL
                </h1>
                <p className="text-xs text-slate-400">P2P Игра в слова на двоих</p>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-2 bg-slate-900/90 border border-slate-800 p-2 rounded-xl text-xs">
              <div className="flex items-center gap-1.5 px-2.5 py-1 bg-slate-800 rounded-lg text-slate-300 font-medium">
                <span className={`w-2 h-2 rounded-full ${peerConnected || role === 'local' ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                <span>{role === 'host' ? 'Игрок 1 (Загадывает)' : role === 'guest' ? 'Игрок 2 (Угадывает)' : 'Локальный Режим'}</span>
              </div>
              
              {role !== 'local' && (
                <button 
                  onClick={copyRoomLink}
                  className="flex items-center gap-1.5 px-3 py-1 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg font-semibold transition active:scale-95 shadow-sm"
                >
                  <i data-lucide={copied ? "check" : "copy"} class="w-3.5 h-3.5"></i>
                  <span>{copied ? 'Скопировано!' : 'Ссылка на комнату'}</span>
                </button>
              )}

              <button 
                onClick={handleFullRestart}
                className="px-2.5 py-1 bg-slate-800 hover:bg-rose-600 text-slate-300 hover:text-white rounded-lg transition"
                title="Новая игра"
              >
                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </header>

          {errorMessage && (
            <div className="my-2 p-3 bg-rose-500/20 border border-rose-500/40 text-rose-300 rounded-xl text-xs sm:text-sm flex items-center gap-2 animate-bounce">
              <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
              <span>{errorMessage}</span>
            </div>
          )}

          {/* Main Area */}
          <main className="w-full max-w-xl flex-1 flex flex-col justify-center items-center my-4 gap-6">

            {/* ЭКРАН 1: ЛОББИ ПОДКЛЮЧЕНИЯ И ГОТОВНОСТИ */}
            {roomData.status === 'lobby' && (
              <div className="w-full bg-slate-900/90 border border-slate-800 p-6 rounded-3xl shadow-2xl flex flex-col items-center gap-6 text-center">
                <div className="p-3 bg-cyan-500/10 text-cyan-400 rounded-full">
                  <i data-lucide="users" class="w-8 h-8"></i>
                </div>
                <div>
                  <h2 className="text-xl font-black tracking-wide text-white">ШАГ 1: ЛОББИ ИГРОКОВ</h2>
                  <p className="text-xs text-slate-400 mt-1">
                    Скопируйте ссылку сверху и отправьте другу. Как только оба подтвердят готовность, Игрок 1 сможет загадать слово!
                  </p>
                </div>

                <div className="grid grid-cols-2 gap-4 w-full max-w-md">
                  {/* Статус Игрока 1 */}
                  <div className={`p-4 rounded-2xl border flex flex-col items-center gap-2 transition ${hostReady ? 'bg-emerald-950/40 border-emerald-500/40 text-emerald-300' : 'bg-slate-950 border-slate-800 text-slate-500'}`}>
                    <i data-lucide={hostReady ? "check-circle-2" : "circle"} class="w-8 h-8"></i>
                    <span className="text-xs font-bold">Игрок 1 (Ведущий)</span>
                    <span className="text-[10px] uppercase font-bold tracking-wider">{hostReady ? 'Готов ✓' : 'Не готов'}</span>
                  </div>

                  {/* Статус Игрока 2 */}
                  <div className={`p-4 rounded-2xl border flex flex-col items-center gap-2 transition ${guestReady ? 'bg-emerald-950/40 border-emerald-500/40 text-emerald-300' : 'bg-slate-950 border-slate-800 text-slate-500'}`}>
                    <i data-lucide={guestReady ? "check-circle-2" : "circle"} class="w-8 h-8"></i>
                    <span className="text-xs font-bold">Игрок 2 (Отгадывает)</span>
                    <span className="text-[10px] uppercase font-bold tracking-wider">{guestReady ? 'Подключен & Готов ✓' : peerConnected ? 'В комнате...' : 'Ожидание входа...'}</span>
                  </div>
                </div>

                {role === 'host' && (
                  <button
                    onClick={handleToggleHostReady}
                    className={`w-full max-w-md py-4 rounded-2xl font-bold text-base transition shadow-lg flex items-center justify-center gap-2 ${
                      hostReady 
                        ? 'bg-slate-800 hover:bg-slate-700 text-slate-300' 
                        : 'bg-cyan-600 hover:bg-cyan-500 text-white shadow-cyan-900/40'
                    }`}
                  >
                    <i data-lucide="thumbs-up" class="w-5 h-5"></i>
                    <span>{hostReady ? 'Отменить готовность' : 'Я ГОТОВ!'}</span>
                  </button>
                )}

                {role === 'guest' && (
                  <button
                    onClick={handleToggleGuestReady}
                    className={`w-full max-w-md py-4 rounded-2xl font-bold text-base transition shadow-lg flex items-center justify-center gap-2 ${
                      guestReady 
                        ? 'bg-slate-800 hover:bg-slate-700 text-slate-300' 
                        : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-900/40 animate-pulse'
                    }`}
                  >
                    <i data-lucide="thumbs-up" class="w-5 h-5"></i>
                    <span>{guestReady ? 'Отменить готовность' : 'Я ГОТОВ ИГРАТЬ!'}</span>
                  </button>
                )}

                {role === 'local' && (
                  <button
                    onClick={handleToggleGuestReady}
                    className="w-full max-w-md py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-2xl"
                  >
                    Начать тест (Соло / 2 игрока на 1 ПК)
                  </button>
                )}
              </div>
            )}

            {/* ЭКРАН 2: Ведущий загадывает слово (ПОСЛЕ подключения в лобби) */}
            {(role === 'host' || role === 'local') && roomData.status === 'setup' && (
              <div className="w-full bg-slate-900/80 border border-slate-800 p-6 rounded-3xl shadow-2xl backdrop-blur-md flex flex-col gap-5 text-center">
                <div className="inline-flex p-3 bg-emerald-500/10 text-emerald-400 rounded-full mx-auto">
                  <i data-lucide="keyboard" class="w-8 h-8"></i>
                </div>
                <div>
                  <h2 className="text-lg sm:text-xl font-bold">ШАГ 2: Загадайте слово</h2>
                  <p className="text-xs text-slate-400 mt-1">От 3 до 10 букв. Игрок 2 сходу получит игровое поле!</p>
                </div>

                <form onSubmit={handleSetSecretWord} className="flex flex-col gap-4">
                  <input 
                    type="text" 
                    value={secretInput}
                    onChange={(e) => setSecretInput(e.target.value.toUpperCase())}
                    placeholder="СЛОВО..."
                    maxLength={10}
                    className="w-full bg-slate-950 border-2 border-slate-700 focus:border-cyan-500 focus:ring-4 focus:ring-cyan-500/20 rounded-2xl p-4 text-center text-2xl font-black tracking-widest text-white uppercase outline-none transition"
                    autoFocus
                  />
                  <button 
                    type="submit"
                    className="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold text-base rounded-2xl shadow-lg shadow-emerald-500/25 transition active:scale-[0.98] flex items-center justify-center gap-2"
                  >
                    <i data-lucide="play" class="w-5 h-5"></i>
                    <span>Загадать слово и Начать Играть!</span>
                  </button>
                </form>
              </div>
            )}

            {/* ЭКРАН 2 (Гость ждет пока Игрок 1 напишет слово) */}
            {role === 'guest' && roomData.status === 'setup' && (
              <div className="w-full bg-slate-900/80 border border-slate-800 p-8 rounded-3xl text-center flex flex-col items-center gap-4">
                <div className="p-4 bg-cyan-500/10 rounded-full text-cyan-400 animate-pulse">
                  <i data-lucide="edit-3" class="w-10 h-10"></i>
                </div>
                <h2 className="text-xl font-bold">Игрок 1 пишет слово...</h2>
                <p className="text-xs text-slate-400 max-w-xs">
                  Оба игрока подтвердили готовность! Как только Игрок 1 нажмет «Начать», у вас откроются ячейки для отгадывания.
                </p>
              </div>
            )}

            {/* ЭКРАН 3: Процесс игры */}
            {(roomData.status === 'playing' || roomData.status === 'won' || roomData.status === 'lost') && (
              <div className="w-full flex flex-col items-center gap-6">

                <div className="w-full flex items-center justify-between px-2">
                  <div className="flex items-center gap-2 text-xs font-medium text-slate-400">
                    <span>Попытка:</span>
                    <span className="text-base font-bold text-cyan-400">{roomData.attempts} / {roomData.maxAttempts}</span>
                  </div>

                  {(role === 'host' || role === 'local') && (
                    <div className="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl text-xs">
                      <span className="text-slate-400">Загадано:</span>
                      <span className="font-bold text-emerald-400 tracking-wider">{roomData.secretWord}</span>
                    </div>
                  )}
                </div>

                {/* Единая строка ячеек */}
                <div className="flex justify-center items-center gap-1.5 sm:gap-2.5 w-full py-4">
                  {Array.from({ length: roomData.wordLength }).map((_, index) => {
                    let letter = '';
                    let status = 'none';

                    if (role === 'guest' || role === 'local') {
                      letter = inputLetters[index] || '';
                      status = letterStatuses[index] || 'none';
                    } else {
                      letter = (roomData.currentInput || '')[index] || '';
                      status = (roomData.checkedStates || [])[index] || 'none';
                    }

                    const isActive = (role === 'guest' || role === 'local') && index === activeCellIndex && roomData.status === 'playing';

                    return (
                      <button
                        key={index}
                        onClick={() => handleCellClick(index)}
                        disabled={roomData.status !== 'playing'}
                        className={`w-11 h-14 sm:w-14 sm:h-18 ${getCellColorClass(status, isActive)} cursor-pointer`}
                      >
                        {letter}
                      </button>
                    );
                  })}
                </div>

                <div className="flex items-center justify-center gap-4 text-[11px] text-slate-400 bg-slate-900/60 border border-slate-800/80 px-4 py-2 rounded-xl">
                  <div className="flex items-center gap-1.5">
                    <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                    <span>На месте</span>
                  </div>
                  <div className="flex items-center gap-1.5">
                    <span className="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                    <span>Есть в слове</span>
                  </div>
                  <div className="flex items-center gap-1.5">
                    <span className="w-2.5 h-2.5 rounded-full bg-slate-700"></span>
                    <span>Нет в слове</span>
                  </div>
                </div>

                {/* Победа */}
                {roomData.status === 'won' && (
                  <div className="w-full bg-emerald-950/60 border border-emerald-500/40 p-5 rounded-2xl text-center flex flex-col items-center gap-3 shadow-xl">
                    <h3 className="text-xl font-black text-emerald-300">
                      ВЫ УГАДАЛИ СЛОВО! 🎉
                    </h3>
                    <p className="text-xs text-slate-300">
                      Слово: <strong className="text-white text-base tracking-widest">{roomData.secretWord}</strong>
                    </p>
                    <button 
                      onClick={handleFullRestart}
                      className="mt-2 px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl transition flex items-center gap-2"
                    >
                      <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                      <span>Начать новую игру</span>
                    </button>
                  </div>
                )}

                {/* Поражение */}
                {roomData.status === 'lost' && (
                  <div className="w-full bg-rose-950/60 border border-rose-500/40 p-5 rounded-2xl text-center flex flex-col items-center gap-3 shadow-xl">
                    <h3 className="text-xl font-black text-rose-400">ПОПЫТКИ ЗАКАНЧАЛИСЬ! 😞</h3>
                    <p className="text-xs text-slate-300">
                      Загаданное слово: <strong className="text-white text-base tracking-widest">{roomData.secretWord}</strong>
                    </p>
                    <button 
                      onClick={handleFullRestart}
                      className="mt-2 px-6 py-2.5 bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs rounded-xl transition flex items-center gap-2"
                    >
                      <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                      <span>Начать новую игру</span>
                    </button>
                  </div>
                )}

                {/* Клавиатура */}
                {(role === 'guest' || role === 'local') && roomData.status === 'playing' && (
                  <div className="w-full flex flex-col gap-1.5 mt-2 select-none">
                    {KEYBOARD_ROWS.map((row, rIdx) => (
                      <div key={rIdx} className="flex justify-center gap-1 sm:gap-1.5">
                        {row.map((char) => (
                          <button
                            key={char}
                            onClick={() => handleKeyPress(char)}
                            className="flex-1 max-w-[40px] h-11 bg-slate-800 hover:bg-slate-700 active:bg-cyan-600 rounded-lg font-bold text-sm sm:text-base text-slate-200 transition shadow"
                          >
                            {char}
                          </button>
                        ))}
                      </div>
                    ))}
                    
                    <div className="flex justify-center gap-2 mt-1">
                      <button
                        onClick={handleDelete}
                        className="flex-1 py-3 bg-slate-800 hover:bg-slate-700 active:bg-rose-600 text-slate-200 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-1 transition"
                      >
                        <span>СТЕРЕТЬ</span>
                      </button>
                      <button
                        onClick={handleCheckWord}
                        className="flex-2 py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-2 transition shadow-lg active:scale-95"
                      >
                        <span>ПРОВЕРИТЬ СЛОВО</span>
                      </button>
                    </div>
                  </div>
                )}

              </div>
            )}
          </main>

          <footer className="w-full max-w-2xl border-t border-slate-800/60 pt-3 text-center text-[11px] text-slate-500">
            Word Duel — P2P WebRTC Игра в слова на двоих
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    setTimeout(() => {
      if (window.lucide) {
        window.lucide.createIcons();
      }
    }, 500);
  </script>
</body>
</html>
