<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Duel — Дуэль Слов Online</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & React DOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- MQTT client via WebSockets (Бесплатный открытый протокол без API-ключей) -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-cyan-500 selection:text-white">
  <div id="root"></div>

  <script>
    const { useState, useEffect, useRef } = React;

    const KEYBOARD_ROWS = [
      ['Й', 'Ц', 'У', 'К', 'Е', 'Н', 'Г', 'Ш', 'Щ', 'З', 'Х', 'Ъ'],
      ['Ф', 'Ы', 'В', 'А', 'П', 'Р', 'О', 'Л', 'Д', 'Ж', 'Э'],
      ['Я', 'Ч', 'С', 'М', 'И', 'Т', 'Ь', 'Б', 'Ю']
    ];

    // Открытый публичный WSS брокер HiveMQ (работает везде, без лимитов и ключей)
    const MQTT_BROKER = 'wss://broker.hivemq.com:8884/mqtt';

    function App() {
      const [roomId, setRoomId] = useState('');
      const [inputRoomCode, setInputRoomCode] = useState('');
      const [role, setRole] = useState(null);
      const [connected, setConnected] = useState(false);
      
      const [hostReady, setHostReady] = useState(false);
      const [guestReady, setGuestReady] = useState(false);

      const [secretWord, setSecretWord] = useState('');
      const [wordLength, setWordLength] = useState(5);
      const [status, setStatus] = useState('menu');
      
      const [inputLetters, setInputLetters] = useState([]);
      const [letterStatuses, setLetterStatuses] = useState([]);
      const [activeCellIndex, setActiveCellIndex] = useState(0);
      const [attempts, setAttempts] = useState(0);

      const [remoteGuestInput, setRemoteGuestInput] = useState('');
      const [remoteGuestStatuses, setRemoteGuestStatuses] = useState([]);

      const [secretInput, setSecretInput] = useState('');
      const [copied, setCopied] = useState(false);
      const [errorMessage, setErrorMessage] = useState('');
      const [logs, setLogs] = useState([]);

      const clientRef = useRef(null);
      const myIdRef = useRef('user_' + Math.random().toString(36).substring(2, 8));

      const addLog = (msg) => {
        console.log(`[LOG] ${msg}`);
        setLogs(prev => [msg, ...prev.slice(0, 5)]);
      };

      const sendSignal = (payload) => {
        if (clientRef.current && clientRef.current.connected && roomId) {
          const topic = `word-duel-game-v1/${roomId}`;
          const msg = JSON.stringify({ senderId: myIdRef.current, ...payload });
          clientRef.current.publish(topic, msg);
        }
      };

      const connectToRoom = (code, myRole) => {
        const cleanCode = code.trim().toUpperCase();
        if (!cleanCode) return;

        setRoomId(cleanCode);
        setRole(myRole);
        window.location.hash = cleanCode;

        if (clientRef.current) {
          try { clientRef.current.end(); } catch(e) {}
        }

        addLog(`Подключение к HiveMQ (${cleanCode})...`);
        const client = mqtt.connect(MQTT_BROKER, {
          clientId: myIdRef.current,
          keepalive: 60,
          clean: true
        });

        clientRef.current = client;

        client.on('connect', () => {
          setConnected(true);
          setStatus('lobby');
          addLog("Сеть подключена! Входим в канал...");

          const topic = `word-duel-game-v1/${cleanCode}`;
          client.subscribe(topic, (err) => {
            if (!err) {
              addLog(`Канал ${cleanCode} активен`);
              setTimeout(() => {
                sendSignal({ type: 'JOIN', role: myRole });
              }, 300);
            }
          });
        });

        client.on('message', (topic, message) => {
          try {
            const data = JSON.parse(message.toString());
            // Игнорируем свои же собственные сообщения
            if (data.senderId === myIdRef.current) return;

            handleIncomingSignal(data, myRole);
          } catch (e) {
            console.error(e);
          }
        });

        client.on('error', (err) => {
          addLog("Ошибка сокета HiveMQ");
        });

        client.on('close', () => {
          setConnected(false);
          addLog("Соединение закрыто");
        });
      };

      useEffect(() => {
        const hash = window.location.hash.replace('#', '').trim().toUpperCase();
        if (hash) {
          connectToRoom(hash, 'guest');
        }
      }, []);

      const handleIncomingSignal = (data, myRole) => {
        switch (data.type) {
          case 'JOIN':
            addLog(`Второй игрок вошел!`);
            if (myRole === 'host' && hostReady) sendSignal({ type: 'READY_STATE', role: 'host', ready: true });
            if (myRole === 'guest' && guestReady) sendSignal({ type: 'READY_STATE', role: 'guest', ready: true });
            break;

          case 'READY_STATE':
            addLog(`Готовность ${data.role}: ${data.ready ? 'ГОТОВ' : 'НЕ ГОТОВ'}`);
            if (data.role === 'host') setHostReady(data.ready);
            if (data.role === 'guest') setGuestReady(data.ready);
            break;

          case 'START_WORD':
            addLog(`Получено слово (${data.length} букв)`);
            setSecretWord(data.word || '');
            setWordLength(data.length);
            setInputLetters(Array(data.length).fill(''));
            setLetterStatuses(Array(data.length).fill('none'));
            setStatus('playing');
            break;

          case 'INPUT_CHANGE':
            if (myRole === 'host') {
              setRemoteGuestInput(data.input);
              setRemoteGuestStatuses(data.statuses);
            }
            break;

          case 'GAME_OVER':
            if (myRole === 'host') {
              setStatus(data.result);
              setAttempts(data.attempts);
            }
            break;

          case 'RESET':
            addLog("Игра сброшена");
            setHostReady(false);
            setGuestReady(false);
            setSecretWord('');
            setStatus('lobby');
            setInputLetters([]);
            setLetterStatuses([]);
            setRemoteGuestInput('');
            setRemoteGuestStatuses([]);
            setAttempts(0);
            break;

          default:
            break;
        }
      };

      const toggleReady = () => {
        if (role === 'host') {
          const nextState = !hostReady;
          setHostReady(nextState);
          sendSignal({ type: 'READY_STATE', role: 'host', ready: nextState });
        } else {
          const nextState = !guestReady;
          setGuestReady(nextState);
          sendSignal({ type: 'READY_STATE', role: 'guest', ready: nextState });
        }
      };

      useEffect(() => {
        if (hostReady && guestReady && status === 'lobby') {
          addLog("Оба игрока готовы!");
          if (role === 'host') {
            setStatus('setup');
          }
        }
      }, [hostReady, guestReady, status, role]);

      const handleCreateRoom = () => {
        const newCode = Math.random().toString(36).substring(2, 7).toUpperCase();
        connectToRoom(newCode, 'host');
      };

      const handleJoinByCode = (e) => {
        e.preventDefault();
        if (inputRoomCode.trim()) {
          connectToRoom(inputRoomCode.trim(), 'guest');
        }
      };

      const handleSetSecretWord = (e) => {
        e.preventDefault();
        const clean = secretInput.trim().toUpperCase();
        if (clean.length < 3 || clean.length > 10) {
          setErrorMessage('Слово должно быть от 3 до 10 букв!');
          return;
        }
        if (!/^[А-ЯЁ]+$/i.test(clean)) {
          setErrorMessage('Только русские буквы!');
          return;
        }

        setErrorMessage('');
        setSecretWord(clean);
        setWordLength(clean.length);
        setStatus('playing');

        sendSignal({
          type: 'START_WORD',
          word: clean,
          length: clean.length
        });
      };

      const handleKeyPress = (letter) => {
        if (status !== 'playing' || role !== 'guest') return;

        const newLetters = [...inputLetters];
        let targetIdx = activeCellIndex;
        if (targetIdx >= wordLength) targetIdx = wordLength - 1;

        newLetters[targetIdx] = letter.toUpperCase();
        const newStatuses = [...letterStatuses];
        newStatuses[targetIdx] = 'none';

        setInputLetters(newLetters);
        setLetterStatuses(newStatuses);

        if (targetIdx < wordLength - 1) setActiveCellIndex(targetIdx + 1);

        sendSignal({
          type: 'INPUT_CHANGE',
          input: newLetters.join(''),
          statuses: newStatuses
        });
      };

      const handleDelete = () => {
        if (status !== 'playing' || role !== 'guest') return;

        const newLetters = [...inputLetters];
        let targetIdx = activeCellIndex;

        if ((!newLetters[targetIdx] || newLetters[targetIdx] === '') && targetIdx > 0) {
          targetIdx = targetIdx - 1;
        }

        newLetters[targetIdx] = '';
        const newStatuses = [...letterStatuses];
        newStatuses[targetIdx] = 'none';

        setInputLetters(newLetters);
        setLetterStatuses(newStatuses);
        setActiveCellIndex(targetIdx);

        sendSignal({
          type: 'INPUT_CHANGE',
          input: newLetters.join(''),
          statuses: newStatuses
        });
      };

      const handleCheckWord = () => {
        if (status !== 'playing' || role !== 'guest') return;

        const guess = inputLetters.join('');
        if (guess.length < wordLength || inputLetters.some(l => !l)) {
          setErrorMessage(`Заполните все ${wordLength} букв!`);
          return;
        }
        setErrorMessage('');

        const target = secretWord.split('');
        const guessArr = guess.split('');
        const results = Array(wordLength).fill('absent');
        const targetTaken = Array(wordLength).fill(false);

        // 1. Зеленые
        guessArr.forEach((char, idx) => {
          if (char === target[idx]) {
            results[idx] = 'correct';
            targetTaken[idx] = true;
          }
        });

        // 2. Желтые
        guessArr.forEach((char, idx) => {
          if (results[idx] !== 'correct') {
            const found = target.findIndex((tChar, tIdx) => tChar === char && !targetTaken[tIdx]);
            if (found !== -1) {
              results[idx] = 'present';
              targetTaken[found] = true;
            }
          }
        });

        setLetterStatuses(results);
        const newAttempts = attempts + 1;
        setAttempts(newAttempts);

        const isWon = results.every(r => r === 'correct');
        const isLost = !isWon && newAttempts >= 6;

        const endState = isWon ? 'won' : (isLost ? 'lost' : 'playing');
        if (endState !== 'playing') setStatus(endState);

        sendSignal({
          type: 'INPUT_CHANGE',
          input: guess,
          statuses: results
        });

        if (endState !== 'playing') {
          sendSignal({
            type: 'GAME_OVER',
            result: endState,
            attempts: newAttempts
          });
        }
      };

      const handleResetGame = () => {
        sendSignal({ type: 'RESET' });
        setHostReady(false);
        setGuestReady(false);
        setSecretWord('');
        setStatus('lobby');
        setInputLetters([]);
        setLetterStatuses([]);
        setRemoteGuestInput('');
        setRemoteGuestStatuses([]);
        setAttempts(0);
      };

      const copyLink = () => {
        const url = `${window.location.origin}${window.location.pathname}#${roomId}`;
        navigator.clipboard.writeText(url);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return React.createElement('div', { className: 'min-h-screen flex flex-col justify-between p-3 sm:p-6 max-w-xl mx-auto' },
        
        // Header
        React.createElement('header', { className: 'flex flex-col sm:flex-row items-center justify-between gap-3 pb-4 border-b border-slate-800' },
          React.createElement('div', { className: 'flex items-center gap-2' },
            React.createElement('div', { className: 'w-8 h-8 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-xl flex items-center justify-center font-black text-lg' }, 'W'),
            React.createElement('h1', { className: 'text-xl font-black tracking-wider bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent' }, 'WORD DUEL')
          ),
          roomId && React.createElement('div', { className: 'flex items-center gap-2 bg-slate-900 border border-slate-800 p-1.5 rounded-xl text-xs' },
            React.createElement('span', { className: 'text-slate-400 px-2 font-mono' }, 'Код: ', React.createElement('strong', { className: 'text-cyan-400' }, roomId)),
            React.createElement('button', { onClick: copyLink, className: 'px-2.5 py-1 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-lg transition active:scale-95' }, copied ? 'Скопировано!' : 'Ссылка'),
            role === 'host' && React.createElement('button', { onClick: handleResetGame, className: 'px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg', title: 'Сбросить игру' }, '↺')
          )
        ),

        // Error message
        errorMessage && React.createElement('div', { className: 'my-2 p-3 bg-rose-500/20 border border-rose-500/40 text-rose-300 rounded-xl text-xs text-center font-semibold' }, `⚠️ ${errorMessage}`),

        // Main
        React.createElement('main', { className: 'my-auto py-4' },
          
          // MENU
          status === 'menu' && React.createElement('div', { className: 'bg-slate-900/80 border border-slate-800 p-6 rounded-3xl shadow-2xl flex flex-col gap-6 text-center' },
            React.createElement('div', null,
              React.createElement('h2', { className: 'text-2xl font-black' }, 'Онлайн Дуэль'),
              React.createElement('p', { className: 'text-xs text-slate-400 mt-1' }, 'Играйте с другом 1 на 1 по сети')
            ),
            React.createElement('div', { className: 'flex flex-col gap-3' },
              React.createElement('button', { onClick: handleCreateRoom, className: 'w-full py-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 font-bold rounded-2xl shadow-lg shadow-cyan-500/20 active:scale-95 transition' }, '➕ Создать новую комнату'),
              React.createElement('div', { className: 'relative my-2' },
                React.createElement('div', { className: 'absolute inset-0 flex items-center' }, React.createElement('div', { className: 'w-full border-t border-slate-800' })),
                React.createElement('div', { className: 'relative text-[10px] uppercase tracking-widest text-slate-500 bg-slate-900 px-2 w-max mx-auto' }, 'Или войдите по коду')
              ),
              React.createElement('form', { onSubmit: handleJoinByCode, className: 'flex gap-2' },
                React.createElement('input', {
                  type: 'text',
                  placeholder: 'КОД КОМНАТЫ',
                  value: inputRoomCode,
                  onChange: (e) => setInputRoomCode(e.target.value.toUpperCase()),
                  className: 'flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 text-center font-mono font-bold uppercase outline-none focus:border-cyan-500'
                }),
                React.createElement('button', { type: 'submit', className: 'px-5 py-3 bg-slate-800 hover:bg-slate-700 font-bold rounded-xl active:scale-95 transition' }, 'Войти')
              )
            )
          ),

          // LOBBY
          status === 'lobby' && React.createElement('div', { className: 'bg-slate-900/80 border border-slate-800 p-6 rounded-3xl text-center flex flex-col gap-5' },
            React.createElement('div', null,
              React.createElement('h2', { className: 'text-xl font-bold' }, 'Лобби комнаты: ', React.createElement('span', { className: 'font-mono text-cyan-400' }, roomId)),
              React.createElement('p', { className: 'text-xs text-slate-400 mt-1' }, 'Оба игрока должны подтвердить готовность')
            ),
            React.createElement('div', { className: 'grid grid-cols-2 gap-3 my-2' },
              React.createElement('div', { className: `p-4 rounded-2xl border ${hostReady ? 'bg-emerald-950/40 border-emerald-500/50 text-emerald-300' : 'bg-slate-950 border-slate-800 text-slate-500'}` },
                React.createElement('div', { className: 'text-xs font-semibold' }, 'Игрок 1 (Ведущий)'),
                React.createElement('div', { className: 'text-sm font-black mt-1' }, hostReady ? 'ГОТОВ ✓' : 'Ожидание...')
              ),
              React.createElement('div', { className: `p-4 rounded-2xl border ${guestReady ? 'bg-emerald-950/40 border-emerald-500/50 text-emerald-300' : 'bg-slate-950 border-slate-800 text-slate-500'}` },
                React.createElement('div', { className: 'text-xs font-semibold' }, 'Игрок 2 (Угадывает)'),
                React.createElement('div', { className: 'text-sm font-black mt-1' }, guestReady ? 'ГОТОВ ✓' : 'Ожидание...')
              )
            ),
            React.createElement('button', {
              onClick: toggleReady,
              className: `w-full py-4 font-black rounded-2xl transition active:scale-95 shadow-lg ${(role === 'host' ? hostReady : guestReady) ? 'bg-slate-800 hover:bg-slate-700 text-slate-300' : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-600/25'}`
            }, (role === 'host' ? hostReady : guestReady) ? 'Отменить готовность' : 'Я ГОТОВ К ИГРЕ!'),
            React.createElement('p', { className: 'text-[11px] text-slate-500' }, 'Передайте код ', React.createElement('strong', { className: 'text-slate-300 font-mono' }, roomId), ' другу для входа.')
          ),

          // SETUP (HOST)
          status === 'setup' && role === 'host' && React.createElement('div', { className: 'bg-slate-900/80 border border-slate-800 p-6 rounded-3xl text-center flex flex-col gap-4' },
            React.createElement('h2', { className: 'text-xl font-bold' }, 'Загадайте тайное слово'),
            React.createElement('form', { onSubmit: handleSetSecretWord, className: 'flex flex-col gap-3' },
              React.createElement('input', {
                type: 'text',
                value: secretInput,
                onChange: (e) => setSecretInput(e.target.value.toUpperCase()),
                placeholder: 'СЛОВО (3-10 БУКВ)',
                maxLength: 10,
                className: 'w-full bg-slate-950 border-2 border-slate-700 focus:border-cyan-500 rounded-2xl p-4 text-center text-2xl font-black tracking-widest uppercase outline-none',
                autoFocus: true
              }),
              React.createElement('button', { type: 'submit', className: 'w-full py-4 bg-cyan-600 hover:bg-cyan-500 font-bold rounded-2xl shadow-lg shadow-cyan-600/20 active:scale-95' }, 'Начать дуэль!')
            )
          ),

          // PLAYING / WON / LOST
          (status === 'playing' || status === 'won' || status === 'lost') && React.createElement('div', { className: 'flex flex-col items-center gap-5' },
            React.createElement('div', { className: 'w-full flex justify-between items-center text-xs text-slate-400 px-2' },
              React.createElement('span', null, 'Попытки: ', React.createElement('strong', { className: 'text-cyan-400 font-bold text-sm' }, `${attempts} / 6`)),
              role === 'host' && React.createElement('span', null, 'Загадано: ', React.createElement('strong', { className: 'text-emerald-400 font-mono' }, secretWord))
            ),

            // Letter Grid
            React.createElement('div', { className: 'flex justify-center gap-1.5 sm:gap-2 w-full py-2' },
              Array.from({ length: wordLength }).map((_, idx) => {
                let letter = '';
                let st = 'none';

                if (role === 'guest') {
                  letter = inputLetters[idx] || '';
                  st = letterStatuses[idx] || 'none';
                } else {
                  letter = (remoteGuestInput || '')[idx] || '';
                  st = (remoteGuestStatuses || [])[idx] || 'none';
                }

                const isActive = role === 'guest' && idx === activeCellIndex && status === 'playing';

                let colorClass = "bg-slate-900 border-slate-800 text-white";
                if (st === 'correct') colorClass = "bg-emerald-600 border-emerald-500 text-white shadow-lg shadow-emerald-900/30";
                if (st === 'present') colorClass = "bg-amber-500 border-amber-400 text-white shadow-lg shadow-amber-900/30";
                if (st === 'absent') colorClass = "bg-slate-800 border-slate-700 text-slate-400";

                return React.createElement('button', {
                  key: idx,
                  onClick: () => role === 'guest' && status === 'playing' && setActiveCellIndex(idx),
                  className: `w-11 h-14 sm:w-14 sm:h-16 rounded-xl border-2 font-black text-2xl flex items-center justify-center uppercase transition-all ${colorClass} ${isActive ? 'ring-4 ring-cyan-500/30 border-cyan-400 scale-105' : ''}`
                }, letter);
              })
            ),

            // Victory / Defeat modals
            status === 'won' && React.createElement('div', { className: 'p-4 bg-emerald-950/60 border border-emerald-500/40 rounded-2xl text-center w-full' },
              React.createElement('h3', { className: 'text-lg font-black text-emerald-300' }, 'СЛОВО УГАДАНО! 🎉'),
              React.createElement('p', { className: 'text-xs text-slate-300 mt-1' }, 'Правильное слово: ', React.createElement('strong', null, secretWord))
            ),

            status === 'lost' && React.createElement('div', { className: 'p-4 bg-rose-950/60 border border-rose-500/40 rounded-2xl text-center w-full' },
              React.createElement('h3', { className: 'text-lg font-black text-rose-400' }, 'ПОПЫТКИ ЗАКАНЧАЛИСЬ! 😞'),
              React.createElement('p', { className: 'text-xs text-slate-300 mt-1' }, 'Правильное слово: ', React.createElement('strong', null, secretWord))
            ),

            // Keyboard for guest
            role === 'guest' && status === 'playing' && React.createElement('div', { className: 'w-full flex flex-col gap-1.5 select-none mt-2' },
              KEYBOARD_ROWS.map((row, rIdx) => 
                React.createElement('div', { key: rIdx, className: 'flex justify-center gap-1' },
                  row.map(char => React.createElement('button', {
                    key: char,
                    onClick: () => handleKeyPress(char),
                    className: 'flex-1 max-w-[38px] h-11 bg-slate-800 hover:bg-slate-700 rounded-lg font-bold text-sm text-slate-200 active:bg-cyan-600 transition'
                  }, char))
                )
              ),
              React.createElement('div', { className: 'flex gap-2 mt-1' },
                React.createElement('button', { onClick: handleDelete, className: 'flex-1 py-3 bg-slate-800 hover:bg-slate-700 font-bold rounded-xl text-xs active:bg-rose-600 transition' }, '✕ СТЕРЕТЬ'),
                React.createElement('button', { onClick: handleCheckWord, className: 'flex-2 py-3 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-xl text-xs active:scale-95 transition shadow-lg shadow-emerald-600/20' }, '✓ ПРОВЕРИТЬ')
              )
            )
          )
        ),

        // Footer
        React.createElement('footer', { className: 'mt-4 pt-3 border-t border-slate-800/60 text-[10px] text-slate-500 font-mono' },
          React.createElement('div', { className: 'flex justify-between items-center mb-1' },
            React.createElement('span', null, 'Сеть HiveMQ: ', React.createElement('strong', { className: connected ? "text-emerald-400" : "text-amber-400" }, connected ? "Подключено" : "Отключено")),
            React.createElement('span', null, 'Роль: ', role || 'Не выбрана')
          ),
          React.createElement('div', { className: 'bg-slate-900/90 border border-slate-800 p-2 rounded-lg max-h-20 overflow-y-auto space-y-0.5' },
            logs.map((log, i) => React.createElement('div', { key: i }, `> ${log}`))
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
