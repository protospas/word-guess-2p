<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Duel — Online</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<div id="app" class="max-w-xl mx-auto p-4 flex flex-col gap-4"></div>

<script>
// ---------- Связь между игроками ----------
// Сообщения идут через бесплатные публичные серверы (MQTT). Прямое соединение не нужно,
// поэтому работает в любых сетях, в том числе на мобильном интернете.
// role: 'host' (создал комнату) / 'guest' (вошёл) — это только про связь.
// side: 'setter' (загадывает) / 'guesser' (угадывает) — игроки выбирают сами в лобби.
const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
const TOPIC = 'wduel-p2p-v1/';
const ME = Math.random().toString(36).slice(2, 10);
const LAYOUTS = {
  ru: [
    ['Й','Ц','У','К','Е','Н','Г','Ш','Щ','З','Х','Ъ'],
    ['Ф','Ы','В','А','П','Р','О','Л','Д','Ж','Э'],
    ['Я','Ч','С','М','И','Т','Ь','Б','Ю','Ё']
  ],
  en: [
    ['Q','W','E','R','T','Y','U','I','O','P'],
    ['A','S','D','F','G','H','J','K','L'],
    ['Z','X','C','V','B','N','M']
  ]
};
const LETTER = /^[\p{Script=Cyrillic}\p{Script=Latin}]+$/u;   // кириллица и латиница
const RANK = { absent: 1, present: 2, correct: 3 };

// ---------- Состояние ----------
// status: menu → lobby (выбор ролей) → setup (загадывающий вводит слово) / waiting (угадывающий ждёт) → playing → won → lobby ...
const S = { role: null, room: '', status: 'menu', connected: false,
  pick: { host: null, guest: null }, side: null, round: 0, keys: {}, kb: 'ru',
  word: '', len: 5, letters: [], marks: [], active: 0, attempts: 0, remoteInput: [], remoteMarks: [],
  error: '', logs: [], copied: false };
let client = null, guestId = null, lastSeen = 0, heartbeat = null;

const $ = id => document.getElementById(id);
const esc = s => String(s || '').replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
function log(m) { console.log('[GAME]', m); S.logs.unshift(m); S.logs = S.logs.slice(0, 6); render(); }
function err(m) { S.error = m; render(); }

function send(d) {
  if (client && client.connected) client.publish(TOPIC + S.room, JSON.stringify({ ...d, from: ME, r: S.role }), { qos: 1 });
}
function stop() {
  if (client) { client.end(true); client = null; }
  guestId = null; S.connected = false;
}
function failStart(msg) {
  stop();
  S.error = msg;
  if (S.status === 'menu') { S.role = null; S.room = ''; }
  log(msg);
}

// Подключение к серверу сообщений (если первый не отвечает, пробуем второй)
function connectBroker(room, onReady, i = 0) {
  if (i >= BROKERS.length) return failStart('Не удалось подключиться к серверу сообщений. Попробуйте позже.');
  log('Подключаюсь к серверу ' + (i + 1) + ' из ' + BROKERS.length + '...');
  const c = mqtt.connect(BROKERS[i], { clientId: 'wd_' + ME + '_' + i, reconnectPeriod: 2000, connectTimeout: 8000 });
  let done = false;
  const timer = setTimeout(() => { if (!done) { c.end(true); connectBroker(room, onReady, i + 1); } }, 9000);

  c.on('connect', () => {
    if (done) return;
    c.subscribe(TOPIC + room, { qos: 1 }, e => {
      if (e || done) return;
      done = true; clearTimeout(timer); client = c;
      if (!heartbeat) heartbeat = setInterval(tick, 4000);
      onReady();
    });
  });
  c.on('message', (_, buf) => {
    let d; try { d = JSON.parse(buf.toString()); } catch (e) { return; }
    receive(d);
  });
  c.on('error', e => console.log('MQTT error', e && e.message));
}

// Раз в 4 секунды: пинг и проверка, что второй игрок ещё на связи
function tick() {
  if (!client || !S.room) return;
  send({ t: 'PING' });
  if (S.connected && Date.now() - lastSeen > 15000) { S.connected = false; log('Соединение с игроком потеряно'); }
}

// ---------- Создание комнаты ----------
function createRoom() {
  stop();
  const code = Math.random().toString(36).substring(2, 8).toUpperCase();
  S.role = 'host'; S.room = code; S.error = '';
  log('Создаём комнату ' + code + '...');
  connectBroker(code, () => { S.status = 'lobby'; log('Комната готова. Код: ' + code); });
}

// ---------- Вход в комнату ----------
function joinRoom(code) {
  code = (code || '').trim().toUpperCase();
  if (!code) return;
  stop();
  S.role = 'guest'; S.room = code; S.error = '';
  log('Подключаемся к комнате ' + code + '...');
  connectBroker(code, () => {
    let tries = 0;
    send({ t: 'HELLO' });
    const t = setInterval(() => {
      if (S.connected) return clearInterval(t);
      if (++tries > 6) { clearInterval(t); return failStart('Комната не найдена или хост не в сети'); }
      send({ t: 'HELLO' });
    }, 1500);
  });
}

// ---------- Получение сообщений ----------
function receive(d) {
  if (d.from === ME || d.r === S.role) return;

  if (S.role === 'host') {
    if (d.t === 'HELLO') {
      if (!guestId || guestId === d.from || !S.connected) {
        // новый игрок зашёл посреди игры — начинаем заново с лобби
        if (!['lobby', 'menu'].includes(S.status) && guestId !== d.from) { S.round++; resetToLobby(); }
        guestId = d.from; S.connected = true; lastSeen = Date.now();
        send({ t: 'WELCOME', to: d.from, round: S.round });
        send({ t: 'PICK', side: S.pick.host, round: S.round });
        log('Игрок 2 подключился!');
      }
      return;
    }
    if (d.from !== guestId) return;
  } else {
    if (d.to && d.to !== ME) return;
    if (d.t === 'WELCOME') {
      S.round = d.round || 0;
      S.connected = true; lastSeen = Date.now();
      if (S.status === 'menu') S.status = 'lobby';
      if (S.status === 'lobby') send({ t: 'PICK', side: S.pick.guest, round: S.round });
      log('Подключено к комнате!');
      return;
    }
    if (S.status === 'menu') return;
  }

  lastSeen = Date.now();
  if (!S.connected) { S.connected = true; log('Связь восстановлена'); }
  if (d.t === 'PING') return;
  onData(d);
}

function onData(d) {
  if (d.t === 'PICK') {
    if (d.round === S.round && S.status === 'lobby') { S.pick[d.r] = d.side; checkStart(); }
  } else if (d.t === 'WORD') {
    if (S.side === 'guesser') {
      S.word = d.word; S.len = d.len; S.letters = Array(d.len).fill(''); S.marks = Array(d.len).fill('');
      S.active = 0; S.attempts = 0; S.status = 'playing';
      S.keys = {}; S.kb = /\p{Script=Cyrillic}/u.test(d.word) ? 'ru' : 'en';
    }
  } else if (d.t === 'INPUT') {
    if (S.side === 'setter') {
      S.remoteInput = d.input; S.remoteMarks = d.marks;
      if (d.attempts != null) S.attempts = d.attempts;
    }
  } else if (d.t === 'OVER') {
    S.status = d.result; S.attempts = d.attempts;
  } else if (d.t === 'RESET') {
    if (d.round > S.round) { S.round = d.round; resetToLobby(); }
  }
  render();
}

// ---------- Лобби: выбор ролей ----------
function otherRole() { return S.role === 'host' ? 'guest' : 'host'; }

function checkStart() {
  if (S.status !== 'lobby') return;
  const mine = S.pick[S.role], theirs = S.pick[otherRole()];
  if (mine && theirs && mine !== theirs) {
    S.side = mine;
    S.status = mine === 'setter' ? 'setup' : 'waiting';
    S.error = '';
  }
}
function pick(side) {
  if (S.status !== 'lobby' || !S.connected) return;
  S.pick[S.role] = S.pick[S.role] === side ? null : side;   // повторное нажатие снимает выбор
  send({ t: 'PICK', side: S.pick[S.role], round: S.round });
  checkStart(); render();
}
function resetToLobby() {
  Object.assign(S, { pick: { host: null, guest: null }, side: null, keys: {}, kb: 'ru', word: '', status: 'lobby', letters: [], marks: [],
    active: 0, attempts: 0, remoteInput: [], remoteMarks: [], error: '' });
}
// Новый раунд: оба игрока возвращаются в лобби и снова выбирают роли
function newRound() {
  S.round++;
  send({ t: 'RESET', round: S.round });
  resetToLobby(); render();
}

// ---------- Загадать слово ----------
function setWord() {
  if (S.side !== 'setter' || S.status !== 'setup') return;
  const w = ($('word').value || '').trim().toUpperCase();
  const n = Array.from(w).length;
  if (n < 2) return err('Слово должно быть хотя бы из 2 букв!');
  if (!LETTER.test(w)) return err('Только буквы (кириллица или латиница), без пробелов и цифр!');
  S.error = ''; S.word = w; S.len = n; S.attempts = 0; S.remoteInput = []; S.remoteMarks = [];
  S.status = 'playing';
  send({ t: 'WORD', word: w, len: n });
  render();
}

// ---------- Игра (угадывающий) ----------
function canGuess() { return S.side === 'guesser' && S.status === 'playing'; }
function sync() { send({ t: 'INPUT', input: S.letters, marks: S.marks }); render(); }
function press(ch) {
  if (!canGuess()) return;
  S.letters[S.active] = ch; S.marks[S.active] = '';
  if (S.active < S.len - 1) S.active++;
  sync();
}
function del() {
  if (!canGuess()) return;
  if (!S.letters[S.active] && S.active > 0) S.active--;
  S.letters[S.active] = ''; S.marks[S.active] = '';
  sync();
}
function check() {
  if (!canGuess()) return;
  if (S.letters.some(l => !l)) return err('Заполните все ' + S.len + ' букв!');
  S.error = '';
  const t = Array.from(S.word), g = S.letters, r = Array(S.len).fill('absent'), used = Array(S.len).fill(false);
  g.forEach((c, i) => { if (c === t[i]) { r[i] = 'correct'; used[i] = true; } });
  g.forEach((c, i) => {
    if (r[i] === 'correct') return;
    const j = t.findIndex((x, k) => x === c && !used[k]);
    if (j > -1) { r[i] = 'present'; used[j] = true; }
  });
  S.marks = r; S.attempts++;
  // запоминаем статус каждой буквы для клавиатуры (лучший результат по всем попыткам)
  g.forEach((c, i) => { const old = S.keys[c]; if (!old || RANK[r[i]] > RANK[old]) S.keys[c] = r[i]; });
  if (r.every(x => x === 'correct')) S.status = 'won';
  send({ t: 'INPUT', input: S.letters, marks: r, attempts: S.attempts });
  if (S.status === 'won') send({ t: 'OVER', result: 'won', attempts: S.attempts });
  render();
}
function copyLink() {
  navigator.clipboard.writeText(location.origin + location.pathname + '#' + S.room);
  S.copied = true; render();
  setTimeout(() => { S.copied = false; render(); }, 2000);
}

// ---------- Отрисовка ----------
const BTN = 'w-full py-4 font-bold rounded-2xl active:scale-95 transition ';
const CARD = 'bg-slate-900 border border-slate-800 p-6 rounded-3xl flex flex-col gap-4 text-center ';

function render() {
  const focused = document.activeElement && document.activeElement.id;
  const saved = { code: $('code') && $('code').value, word: $('word') && $('word').value };
  const st = S.status;
  let h = '';

  // Шапка
  const inGame = ['setup', 'waiting', 'playing', 'won'].includes(st);
  h += `<header class="flex items-center justify-between pb-3 border-b border-slate-800">
    <h1 class="text-xl font-black tracking-wider">WORD DUEL</h1>
    ${S.room ? `<div class="flex items-center gap-2 text-xs">
      <span class="font-mono text-slate-400">Код: <b class="text-cyan-400">${esc(S.room)}</b></span>
      <button onclick="copyLink()" class="px-3 py-1 bg-cyan-600 rounded-lg font-bold">${S.copied ? 'Скопировано!' : 'Ссылка'}</button>
      ${inGame ? `<button onclick="newRound()" class="px-2 py-1 bg-slate-800 rounded-lg" title="Вернуться в лобби и выбрать роли заново">↺</button>` : ''}
    </div>` : ''}
  </header>`;

  if (S.error) h += `<div class="p-3 bg-rose-500/20 border border-rose-500/40 text-rose-300 rounded-xl text-xs text-center font-semibold">⚠️ ${esc(S.error)}</div>`;

  // Меню
  if (st === 'menu') {
    h += `<div class="${CARD}">
      <h2 class="text-2xl font-black">Онлайн дуэль</h2>
      <button onclick="createRoom()" class="${BTN} bg-gradient-to-r from-cyan-500 to-blue-600">➕ Создать комнату</button>
      <div class="text-[11px] uppercase tracking-widest text-slate-500">или войдите по коду</div>
      <div class="flex gap-2">
        <input id="code" placeholder="КОД" maxlength="8" onkeydown="if(event.key==='Enter')joinRoom(this.value)"
          class="flex-1 min-w-0 bg-slate-950 border border-slate-800 rounded-xl px-4 text-center font-mono font-bold uppercase outline-none focus:border-cyan-500">
        <button onclick="joinRoom($('code').value)" class="px-5 py-3 bg-slate-800 font-bold rounded-xl">Войти</button>
      </div>
    </div>`;
  }

  // Лобби: выбор ролей
  if (st === 'lobby') {
    const mine = S.pick[S.role], theirs = S.pick[otherRole()];
    const label = p => p === 'setter' ? '✍️ Загадывает' : p === 'guesser' ? '🔍 Угадывает' : 'Выбирает...';
    const card = (title, p) => `<div class="p-4 rounded-2xl border ${p ? 'bg-emerald-950/40 border-emerald-500/50 text-emerald-300' : 'bg-slate-950 border-slate-800 text-slate-500'}">
      <div class="text-xs font-semibold">${title}</div><div class="text-sm font-black mt-1">${label(p)}</div></div>`;
    const opt = (side, text) => `<button onclick="pick('${side}')" class="${BTN} ${mine === side ? 'bg-emerald-600' : 'bg-slate-800'}">${text}</button>`;
    let note = '';
    if (!S.connected) note = 'Ждём второго игрока... Отправьте ему ссылку или код.';
    else if (mine && theirs && mine === theirs) note = 'Вы выбрали одинаковые роли. Один из вас должен выбрать другую.';
    else if (!mine) note = 'Выберите свою роль. Игра начнётся, когда роли будут разными.';
    else note = 'Ждём выбор соперника...';
    h += `<div class="${CARD}">
      <h2 class="text-xl font-bold">Лобби</h2>
      <div class="grid grid-cols-2 gap-3">${card('Вы', mine)}${card('Соперник', theirs)}</div>
      ${S.connected ? `<div class="flex flex-col gap-2">${opt('setter', '✍️ Я загадываю слово')}${opt('guesser', '🔍 Я угадываю слово')}</div>` : ''}
      <p class="text-xs text-slate-400">${note}</p>
    </div>`;
  }

  // Загадывающий вводит слово
  if (st === 'setup') {
    h += `<div class="${CARD}">
      <h2 class="text-xl font-bold">Загадайте тайное слово</h2>
      <p class="text-xs text-slate-400">Любая длина, кириллица или латиница</p>
      <input id="word" placeholder="СЛОВО" autocomplete="off" onkeydown="if(event.key==='Enter')setWord()"
        class="w-full bg-slate-950 border-2 border-slate-700 focus:border-cyan-500 rounded-2xl p-4 text-center text-2xl font-black tracking-widest uppercase outline-none">
      <button onclick="setWord()" class="${BTN} bg-cyan-600">Начать дуэль!</button>
    </div>`;
  }

  // Угадывающий ждёт
  if (st === 'waiting') {
    h += `<div class="${CARD}">
      <h2 class="text-xl font-bold">Соперник загадывает слово...</h2>
      <p class="text-xs text-slate-400">Игра начнётся, как только слово будет готово.</p>
    </div>`;
  }

  // Игра
  if (st === 'playing' || st === 'won') {
    const guesser = S.side === 'guesser';
    const letters = guesser ? S.letters : S.remoteInput;
    const marks = guesser ? S.marks : S.remoteMarks;
    const colors = { correct: 'bg-emerald-600 border-emerald-500', present: 'bg-amber-500 border-amber-400', absent: 'bg-slate-800 border-slate-700 text-slate-400' };
    let cells = '';
    for (let i = 0; i < S.len; i++) {
      const cls = colors[(marks || [])[i]] || 'bg-slate-900 border-slate-800';
      const act = guesser && st === 'playing' && i === S.active ? 'ring-4 ring-cyan-500/30 border-cyan-400 scale-105' : '';
      cells += `<button onclick="S.active=${i};render()" style="width:var(--w);height:calc(var(--w)*1.25);font-size:calc(var(--w)*.55)" class="rounded-xl border-2 font-black flex items-center justify-center transition-all ${cls} ${act}">${esc((letters || [])[i])}</button>`;
    }
    h += `<div class="flex flex-col items-center gap-4">
      <div class="w-full flex justify-between text-xs text-slate-400 px-2">
        <span>Попытки: <b class="text-cyan-400 text-sm">${S.attempts}</b></span>
        ${!guesser ? `<span>Загадано: <b class="text-emerald-400 font-mono">${esc(S.word)}</b></span>` : `<span>Вы угадываете</span>`}
      </div>
      <div class="flex flex-wrap justify-center gap-1.5 w-full" style="--w:clamp(22px, calc((min(100vw, 576px) - 64px) / ${S.len} - 6px), 56px)">${cells}</div>`;
    if (st === 'won') {
      h += `<div class="p-4 bg-emerald-950/60 border border-emerald-500/40 rounded-2xl text-center w-full">
        <b class="text-emerald-300">${guesser ? 'ВЫ УГАДАЛИ СЛОВО! 🎉' : 'СОПЕРНИК УГАДАЛ СЛОВО! 🎉'}</b>
        <div class="text-xs mt-1">Слово: <b>${esc(S.word)}</b> · попыток: ${S.attempts}</div></div>
        <button onclick="newRound()" class="${BTN} bg-cyan-600">Начать новый раунд</button>`;
    }
    if (guesser && st === 'playing') {
      // буквы, которых нет на раскладках (например, украинские), добавляются отдельной строкой
      const known = new Set([...LAYOUTS.ru.flat(), ...LAYOUTS.en.flat()]);
      const extra = [...new Set(Array.from(S.word))].filter(c => !known.has(c));
      const rows = LAYOUTS[S.kb].concat(extra.length ? [extra] : []);
      // буквы, которые проверка признала «нет в слове», затемняются
      const key = c => `<button onclick="press('${c}')" class="flex-1 max-w-[38px] h-11 rounded-lg font-bold text-sm transition ${S.keys[c] === 'absent' ? 'bg-slate-900 text-slate-600 opacity-40' : 'bg-slate-800 active:bg-cyan-600'}">${c}</button>`;
      h += `<div class="w-full flex flex-col gap-1.5 select-none">`;
      rows.forEach(row => { h += `<div class="flex justify-center gap-1">${row.map(key).join('')}</div>`; });
      h += `<div class="flex gap-2 mt-1">
        <button onclick="S.kb=S.kb==='ru'?'en':'ru';render()" class="px-4 py-3 bg-slate-800 font-bold rounded-xl text-xs">🌐 ${S.kb === 'ru' ? 'EN' : 'RU'}</button>
        <button onclick="del()" class="flex-1 py-3 bg-slate-800 font-bold rounded-xl text-xs">✕ СТЕРЕТЬ</button>
        <button onclick="check()" class="flex-[2] py-3 bg-emerald-600 font-bold rounded-xl text-xs">✓ ПРОВЕРИТЬ</button>
      </div></div>`;
    }
    h += `</div>`;
  }

  // Подвал
  h += `<footer class="pt-3 border-t border-slate-800 text-[10px] text-slate-500 font-mono">
    <div class="flex justify-between mb-1">
      <span>Связь: <b class="${S.connected ? 'text-emerald-400' : 'text-amber-400'}">${S.connected ? 'есть' : 'нет'}</b></span>
      <span>${S.side === 'setter' ? 'Загадываю' : S.side === 'guesser' ? 'Угадываю' : 'Роль не выбрана'} · версия 5</span>
    </div>
    <div class="bg-slate-900 border border-slate-800 p-2 rounded-lg max-h-24 overflow-y-auto">${S.logs.map(l => '> ' + esc(l)).join('<br>')}</div>
  </footer>`;

  $('app').innerHTML = h;
  if ($('code') && saved.code) $('code').value = saved.code;
  if ($('word') && saved.word) $('word').value = saved.word;
  if (focused && $(focused)) $(focused).focus();
}

// ---------- Физическая клавиатура ----------
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.ctrlKey || e.metaKey) return;
  if (e.key === 'Backspace') del();
  else if (e.key === 'Enter') check();
  else if (e.key.length === 1 && LETTER.test(e.key)) press(e.key.toUpperCase());
});

// ---------- Старт: если открыли по ссылке с #КОД — входим в комнату ----------
render();
const hash = location.hash.replace('#', '').trim();
if (hash) joinRoom(hash);
</script>
</body>
</html>
